# 生产环境配置，由 SPRING_PROFILES_ACTIVE=prod 激活。
# 本文件只放结构，密码与密钥一律走环境变量，不入库。
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/mindmate}
    username: ${DB_USERNAME:mindmate}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 6
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # PostgreSQL 不需要 FROM DUAL
      connection-test-query: SELECT 1
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

mindmate:
  auth:
    expose-sms-code: false
    fixed-code: ${AUTH_FIXED_CODE:}
  avatar:
    directory: ${MINDMATE_AVATAR_DIRECTORY:/opt/mindmate/uploads/avatars}
  quote:
    directory: ${MINDMATE_QUOTE_DIRECTORY:/opt/mindmate/uploads/quotes}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
