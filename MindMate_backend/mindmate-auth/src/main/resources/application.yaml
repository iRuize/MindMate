spring:
  servlet:
    multipart:
      max-file-size: 2MB
      # 为 multipart 边界和表单头预留空间，文件本身仍限制为 2MB
      max-request-size: 3MB
  datasource:
    # 本地达梦 DM8，默认模式 MINDMATE
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://localhost:5236?schema=MINDMATE
    username: SYSDBA
    password: Duohereshui1
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 达梦连接有效性检测
      connection-test-query: SELECT 1 FROM DUAL

  redis:
    host: 127.0.0.1
    port: 6379

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 达梦自增列（IDENTITY）由数据库生成，对应 IdType.AUTO
      id-type: auto
      # 注意：逻辑删除未设为全局配置。SYS_USER 表无 deleted 列，
      # 若全局启用 logic-delete-field 会给所有查询拼上 deleted=0 导致报错，
      # 改由 Task 实体上的 @TableLogic 单独声明。

mindmate:
  avatar:
    # 相对路径基于后端进程工作目录，可通过环境变量指定持久化目录
    directory: ${MINDMATE_AVATAR_DIRECTORY:./uploads/avatars}
  auth:
    # 登录凭证有效期（小时），默认 7 天，每次访问自动续期
    token-ttl-hours: 168
    # 伪装短信：验证码是否随响应体回传。接入真实短信服务商后必须改为 false
    expose-sms-code: true
