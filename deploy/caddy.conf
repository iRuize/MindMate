# 部署在腾讯云 CVM 上的 Caddy 站点片段，放入 /etc/caddy/acli.d/sites/mindmate.caddy
# 80/443 由既有 ACLI 管理的 Caddy 占用，这里单独监听 8081，互不影响。
:8081 {
    encode gzip

    handle /auth* {
        reverse_proxy 127.0.0.1:8080
    }
    handle /tasks* {
        reverse_proxy 127.0.0.1:8080
    }
    handle /decisions* {
        reverse_proxy 127.0.0.1:8080
    }
    handle /quotes* {
        reverse_proxy 127.0.0.1:8080
    }
    handle /media* {
        reverse_proxy 127.0.0.1:8080
    }
    handle /avatars* {
        reverse_proxy 127.0.0.1:8080
    }
    handle {
        root * /opt/mindmate/web
        try_files {path} /index.html
        file_server
    }
}
